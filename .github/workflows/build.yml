# SPDX-License-Identifier: GPL-3.0-or-later
# Pruebas e instaladores para Windows y Linux en cada push.
# Al subir una etiqueta "v*" (p. ej. v0.1.0) se publica además una versión (release)
# con los instaladores y las notas de packaging/RELEASE_NOTES.md.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compilar ejecutable e instalador
        shell: pwsh
        env:
          APP_URL: https://github.com/${{ github.repository }}
        run: ./packaging/windows/build.ps1
      - name: Probar el instalador (instalar y arrancar el juego)
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\Quadrafall-*-Windows-Setup.exe).FullName
          $dir = "$env:RUNNER_TEMP\quadrafall"
          $shot = "$env:RUNNER_TEMP\prueba-windows.png"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=`"$dir`"" -Wait
          $env:SDL_AUDIODRIVER = "dummy"
          Start-Process "$dir\Quadrafall.exe" -ArgumentList "--screenshot", "`"$shot`"" -Wait
          if (-not (Test-Path $shot)) { throw "El juego instalado no arrancó" }
      - uses: actions/upload-artifact@v5
        with:
          name: prueba-windows
          path: ${{ runner.temp }}/prueba-windows.png
      - uses: actions/upload-artifact@v5
        with:
          name: quadrafall-windows
          path: |
            dist/Quadrafall-*-Windows-Setup.exe
            dist/Quadrafall-*-Windows-Portable.zip
          if-no-files-found: error

  linux:
    # 22.04 para que los binarios funcionen también en distribuciones algo antiguas.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Descargar appimagetool
        run: |
          curl -sSfL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Compilar AppImage, .deb y .tar.gz
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"
          SDL_AUDIODRIVER: dummy
          SDL_VIDEODRIVER: dummy
        run: sh packaging/linux/build.sh
      - name: Probar la AppImage y el .deb (arrancar el juego)
        timeout-minutes: 5
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          SDL_AUDIODRIVER: dummy
        run: |
          xvfb-run -a dist/Quadrafall-*-Linux-*.AppImage --screenshot "$RUNNER_TEMP/prueba-appimage.png"
          sudo apt-get install -y ./dist/quadrafall_*.deb
          xvfb-run -a quadrafall --screenshot "$RUNNER_TEMP/prueba-deb.png"
          test -s "$RUNNER_TEMP/prueba-appimage.png"
          test -s "$RUNNER_TEMP/prueba-deb.png"
      - uses: actions/upload-artifact@v5
        with:
          name: prueba-linux
          path: ${{ runner.temp }}/prueba-*.png
      - uses: actions/upload-artifact@v5
        with:
          name: quadrafall-linux
          path: |
            dist/Quadrafall-*-Linux-*.AppImage
            dist/Quadrafall-*-Linux-*.tar.gz
            dist/quadrafall_*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: quadrafall-*   # solo las descargas, no las capturas de prueba
          merge-multiple: true
      - name: Preparar notas
        run: sed "s/{VERSION}/${GITHUB_REF_NAME#v}/g" packaging/RELEASE_NOTES.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Quadrafall ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
