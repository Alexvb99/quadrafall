# Pruebas y ejecutables para Windows y Linux en cada push.
# Al subir una etiqueta "v*" (p. ej. v0.1.0) además se crea una versión (release) con los archivos.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: dist/Quadrafall-*-windows.zip
          - os: ubuntu-22.04
            artifact: dist/Quadrafall-*-linux-*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Compilar (Linux)
        if: runner.os == 'Linux'
        env:
          SDL_AUDIODRIVER: dummy
        run: sh packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: quadrafall-${{ runner.os }}
          path: ${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
