[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quadrafall"
version = "0.1.0"
description = "Juego libre de bloques que caen, inspirado en Quadrapassel y en el clásico de NES"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pygame-ce>=2.5"]
keywords = ["game", "puzzle", "falling-blocks", "quadrapassel"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Games/Entertainment :: Puzzle Games",
]

[project.urls]
Homepage = "https://github.com/Alexvb99/quadrafall"
Issues = "https://github.com/Alexvb99/quadrafall/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
quadrafall = "quadrafall.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quadrafall = ["assets/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
